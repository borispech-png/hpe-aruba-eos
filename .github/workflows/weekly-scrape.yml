name: Weekly HPE/Aruba EOS Data Refresh

on:
  schedule:
    # Lance le job tous les lundis à 8h00 UTC
    - cron: "0 8 * * 1"
  # Permet de lancer manuellement depuis l'interface GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Installation des dépendances
        run: npm install axios cheerio dotenv

      - name: 📂 Vérification des fichiers
        run: ls -R

      - name: 🕷️ Lancement du Scraper
        run: |
          node scrape-hpe-tables.js 

          # Vérifier que le fichier a bien été créé
          if [ -f "src/hpe-eos-detailed.json" ]; then
            echo "✅ Fichier JSON généré avec succès"
            # Copier le résultat dans public/
            mkdir -p public
            cp src/hpe-eos-detailed.json public/hpe-enriched-data.json
          else
            echo "❌ Erreur : Le fichier JSON n'a pas été généré"
            exit 1
          fi

      - name: 🔍 Vérification des changements
        id: check_changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Ajoute les fichiers de données potentiellement modifiés
          git add src/hpe-eos-detailed.json public/hpe-enriched-data.json hpe-eos-detailed.csv

          # Vérifie s'il y a des différences
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ Aucune modification détectée. Les données sont à jour."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "⚠️ Nouvelles données détectées !"
          fi

      - name: 💾 Commit et Push (si changements)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "data: 🔄 Mise à jour automatique des produits EOS"
          git push
